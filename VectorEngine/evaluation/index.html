<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RealSearch</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2ec;
    --card: #ffffff;
    --ink: #1a1712;
    --muted: #7a756c;
    --accent: #c8622a;
    --accent-light: #f0ddd1;
    --border: #e2ddd6;
    --radius: 12px;
    --shadow: 0 2px 16px rgba(26,23,18,0.08);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Header ──────────────────────────────── */
  header {
    padding: 28px 40px 20px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.7rem;
    letter-spacing: -0.5px;
  }
  header span {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 300;
  }

  /* ── Search panel ────────────────────────── */
  .search-panel {
    max-width: 860px;
    margin: 36px auto 0;
    padding: 0 24px;
  }

  .query-row {
    display: flex;
    gap: 10px;
  }
  .query-row input {
    flex: 1;
    padding: 14px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
  }
  .query-row input:focus { border-color: var(--accent); }

  button.search-btn {
    padding: 14px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }
  button.search-btn:hover { background: #b0561f; }
  button.search-btn:active { transform: scale(0.98); }
  button.search-btn:disabled { background: #c8a898; cursor: not-allowed; }

  /* ── Filters ─────────────────────────────── */
  .filters {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-group label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .filter-group input {
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-family: inherit;
    font-size: 0.88rem;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  .filter-group input:focus { border-color: var(--accent); }
  .filter-group input::placeholder { color: #bbb; }

  /* ── Enriched query preview ──────────────── */
  .query-preview {
    margin-top: 14px;
    padding: 10px 14px;
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 0.82rem;
    color: #7a3a18;
    display: none;
  }
  .query-preview.visible { display: block; }

  /* ── Status bar ──────────────────────────── */
  .status {
    max-width: 860px;
    margin: 20px auto 0;
    padding: 0 24px;
    font-size: 0.82rem;
    color: var(--muted);
    min-height: 20px;
  }
  .status .count { color: var(--accent); font-weight: 500; }

  /* ── Results grid ────────────────────────── */
  .results {
    max-width: 860px;
    margin: 16px auto 60px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }

  /* ── Property card ───────────────────────── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform .2s, box-shadow .2s;
    animation: fadeUp .35s ease both;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(26,23,18,0.12);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: #e8e3da;
    display: block;
  }
  .card-img-placeholder {
    width: 100%;
    height: 160px;
    background: linear-gradient(135deg, #e8e3da 0%, #d4cfc6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-img-placeholder svg { opacity: 0.3; }

  .card-body {
    padding: 16px 18px 18px;
  }
  .card-id {
    font-size: 0.68rem;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .card-type {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: .5px;
    text-transform: uppercase;
    background: var(--accent-light);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .card-desc {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .meta-item svg { flex-shrink: 0; }
  .card-price {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .card-location {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ── Loading spinner ─────────────────────── */
  .spinner {
    display: none;
    width: 22px; height: 22px;
    border: 2.5px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Empty / error state ─────────────────── */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

  @media (max-width: 640px) {
    header { padding: 20px 20px 16px; }
    .search-panel, .results, .status { padding: 0 16px; }
    .filters { grid-template-columns: 1fr 1fr; }
    .query-row { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1>RealSearch</h1>
  <span>Property Intelligence</span>
</header>

<div class="search-panel">
  <div class="query-row">
    <input id="queryInput" type="text" placeholder="Describe the property you're looking for…" />
    <button class="search-btn" id="searchBtn" onclick="runSearch()">
      <span id="btnText">Search</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label>Min Price</label>
      <input id="priceMin" type="number" placeholder="e.g. 200000" min="0" />
    </div>
    <div class="filter-group">
      <label>Max Price</label>
      <input id="priceMax" type="number" placeholder="e.g. 800000" min="0" />
    </div>
    <div class="filter-group">
      <label>Bedrooms</label>
      <input id="bedrooms" type="number" placeholder="e.g. 3" min="0" />
    </div>
    <div class="filter-group">
      <label>Bathrooms</label>
      <input id="bathrooms" type="number" placeholder="e.g. 2" min="0" />
    </div>
    <div class="filter-group">
      <label>Area (sq ft)</label>
      <input id="area" type="number" placeholder="e.g. 1500" min="0" />
    </div>
  </div>

  <div class="query-preview" id="queryPreview"></div>
</div>

<div class="status" id="status"></div>
<div class="results" id="results"></div>

<script>
  // Live preview of enriched query
  const PREVIEW_FIELDS = ['priceMin','priceMax','bedrooms','bathrooms','area'];
  PREVIEW_FIELDS.forEach(id => {
    document.getElementById(id).addEventListener('input', updatePreview);
  });
  document.getElementById('queryInput').addEventListener('input', updatePreview);
  document.getElementById('queryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') runSearch();
  });

  function buildEnrichedQuery() {
    const q = document.getElementById('queryInput').value.trim();
    if (!q) return '';
    const parts = [q];
    const pMin = document.getElementById('priceMin').value;
    const pMax = document.getElementById('priceMax').value;
    const beds = document.getElementById('bedrooms').value;
    const baths = document.getElementById('bathrooms').value;
    const area = document.getElementById('area').value;

    if (pMin && pMax) parts.push(`The price should be between ${Number(pMin).toLocaleString()} and ${Number(pMax).toLocaleString()}.`);
    else if (pMin) parts.push(`The price should be at least ${Number(pMin).toLocaleString()}.`);
    else if (pMax) parts.push(`The price should be at most ${Number(pMax).toLocaleString()}.`);
    if (beds) parts.push(`It should have ${beds} bedroom(s).`);
    if (baths) parts.push(`It should have ${baths} bathroom(s).`);
    if (area) parts.push(`The area should be around ${Number(area).toLocaleString()} square feet.`);
    return parts.join(' ');
  }

  function updatePreview() {
    const preview = document.getElementById('queryPreview');
    const enriched = buildEnrichedQuery();
    if (enriched && enriched !== document.getElementById('queryInput').value.trim()) {
      preview.textContent = '📝 ' + enriched;
      preview.classList.add('visible');
    } else {
      preview.classList.remove('visible');
    }
  }

  async function runSearch() {
    const query = document.getElementById('queryInput').value.trim();
    if (!query) {
      document.getElementById('queryInput').focus();
      return;
    }

    const btn = document.getElementById('searchBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const status = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    btn.disabled = true;
    btnText.textContent = 'Searching';
    spinner.style.display = 'inline-block';
    status.innerHTML = 'Running semantic search…';
    resultsEl.innerHTML = '';

    const payload = {
      query,
      price_min: document.getElementById('priceMin').value ? Number(document.getElementById('priceMin').value) : null,
      price_max: document.getElementById('priceMax').value ? Number(document.getElementById('priceMax').value) : null,
      bedrooms:  document.getElementById('bedrooms').value  ? Number(document.getElementById('bedrooms').value)  : null,
      bathrooms: document.getElementById('bathrooms').value ? Number(document.getElementById('bathrooms').value) : null,
      area:      document.getElementById('area').value      ? Number(document.getElementById('area').value)      : null,
    };

    try {
      const res = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || res.statusText);
      }
      const data = await res.json();
      renderResults(data);
    } catch (err) {
      status.innerHTML = `<span style="color:#c0392b">Error: ${err.message}</span>`;
    } finally {
      btn.disabled = false;
      btnText.textContent = 'Search';
      spinner.style.display = 'none';
    }
  }

  function renderResults(data) {
    const status = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    const count = data.count ?? data.results?.length ?? 0;
    status.innerHTML = count
      ? `Showing <span class="count">${count}</span> properties`
      : 'No properties found for your query.';

    if (!data.results || data.results.length === 0) {
      resultsEl.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🏚️</div>
          <div>No matching properties found. Try adjusting your filters.</div>
        </div>`;
      return;
    }

    resultsEl.innerHTML = data.results.map((p, i) => cardHTML(p, i)).join('');
  }

  function cardHTML(p, i) {
    const delay = `animation-delay: ${i * 0.04}s`;
    const img = p.image_url
      ? `<img class="card-img" src="${esc(p.image_url)}" alt="${esc(p.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="card-img-placeholder" style="display:none">${houseSVG()}</div>`
      : `<div class="card-img-placeholder">${houseSVG()}</div>`;

    const price = p.price != null
      ? `<div class="card-price">${formatPrice(p.price)}</div>`
      : '';

    const location = p.location
      ? `<div class="card-location">📍 ${esc(p.location)}</div>`
      : '';

    const type = p.property_type
      ? `<span class="card-type">${esc(p.property_type)}</span>`
      : '';

    const desc = p.description
      ? `<div class="card-desc">${esc(p.description)}</div>`
      : '';

    const metaParts = [];
    if (p.bedrooms != null)  metaParts.push(`<span class="meta-item">${bedSVG()} ${p.bedrooms} bed</span>`);
    if (p.bathrooms != null) metaParts.push(`<span class="meta-item">${bathSVG()} ${p.bathrooms} bath</span>`);
    if (p.area != null)      metaParts.push(`<span class="meta-item">${areaSVG()} ${Number(p.area).toLocaleString()} sq ft</span>`);
    const meta = metaParts.length ? `<div class="card-meta">${metaParts.join('')}</div>` : '';

    return `
      <div class="card" style="${delay}">
        ${img}
        <div class="card-body">
          <div class="card-id">ID: ${esc(String(p.property_id))}</div>
          <div class="card-title">${esc(p.title || 'Untitled Property')}</div>
          ${type}
          ${price}
          ${location}
          ${desc}
          ${meta}
        </div>
      </div>`;
  }

  function formatPrice(v) {
    if (!v) return '';
    return '$' + Number(v).toLocaleString();
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function houseSVG() {
    return `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7a756c" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>`;
  }
  function bedSVG() {
    return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9V19M22 9V19M2 14h20M2 9a5 5 0 015-5h10a5 5 0 015 5"/></svg>`;
  }
  function bathSVG() {
    return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16v4a4 4 0 01-4 4H8a4 4 0 01-4-4v-4z"/><path d="M6 12V5a2 2 0 012-2h1"/></svg>`;
  }
  function areaSVG() {
    return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>`;
  }
</script>
</body>
</html>
